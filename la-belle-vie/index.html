<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Belle Vie</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#3a2f3f;--ink2:#7a6b7f;--rose:#ff5d8f;--bg:#fff8f4;--card:#ffffff;--line:rgba(58,47,63,.12)}
@media (prefers-color-scheme:dark){:root{--ink:#f6eef3;--ink2:#c9b9c4;--bg:#1d1820;--card:#2a2330;--line:rgba(255,255,255,.12)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 20px 64px}
h1{font-family:"Playfair Display",Georgia,serif;font-size:40px;line-height:1.1;margin:0 0 6px}
h2{font-size:19px;margin:32px 0 8px}
.sub{color:var(--ink2);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:16px 0}
a{color:var(--rose)}ul{padding-left:20px}li{margin:4px 0}
.back{display:inline-block;margin-bottom:24px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>La Belle Vie</h1>
<p class="sub">Your luxury life in Paris. Coming soon to the App Store for iPhone and iPad.</p>
<p><a href="support.html">Help</a> · <a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
