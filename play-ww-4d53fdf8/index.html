<title>Wander Wild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Wander Wild: a family camping road trip. The world is drawn on one canvas.
   Bright sky colours, white glass panels, big round friendly buttons. No dark screens. */
:root{
  --ink:#1d2433; --ink2:#5b6577; --ink3:#9aa3b2;
  --glass:rgba(255,255,255,.86); --line:rgba(20,40,80,.08);
  --sky:#2f9bff; --leaf:#22c27a; --sun:#ffb72b; --coral:#ff7a59; --berry:#ff5d8f; --lake:#14b8c9; --grape:#8b6cff; --sand:#ffe7c2;
  --round:"Fredoka","Baloo 2",ui-rounded,-apple-system,system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --shadow:0 14px 44px rgba(30,60,120,.16),0 2px 8px rgba(30,60,120,.08);
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#eaf6ff;color:var(--ink)}
body{font-family:var(--ui);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#g3{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input{font:inherit;color:var(--ink)}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:999px;font-family:var(--round);font-weight:600;font-size:18px;background:var(--sky);color:#fff;transition:transform .12s,filter .12s;white-space:nowrap;box-shadow:0 6px 16px rgba(47,155,255,.28)}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.95)}
.btn.leaf{background:var(--leaf);box-shadow:0 6px 16px rgba(34,194,122,.3)} .btn.sun{background:var(--sun);color:#4a2c00;box-shadow:0 6px 16px rgba(255,183,43,.35)}
.btn.coral{background:var(--coral);box-shadow:0 6px 16px rgba(255,122,89,.3)} .btn.berry{background:var(--berry);box-shadow:0 6px 16px rgba(255,93,143,.3)} .btn.grape{background:var(--grape);box-shadow:0 6px 16px rgba(139,108,255,.3)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(30,60,120,.12)}
.btn.sm{height:38px;padding:0 16px;font-size:15px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(20,40,80,.06);white-space:nowrap}
.chip.leaf{background:#dcf7ea;color:#0a7a4b}.chip.sky{background:#dff0ff;color:#0d5fb3}.chip.sun{background:#fff1d1;color:#8a5800}.chip.berry{background:#ffe2ec;color:#c2185b}.chip.grape{background:#ece6ff;color:#5b3fc4}
h1,h2,h3{font-family:var(--round);font-weight:600;margin:0}

/* ---------- Full-page screens (title, profile, planner, postcard) ---------- */
.page{position:fixed;inset:0;z-index:40;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 110px) max(16px,env(safe-area-inset-left,0px));
  box-sizing:border-box;background:linear-gradient(180deg,#d9efff 0%,#f4fbff 45%,#fff8ec 100%)}
.page .wrap{max-width:980px;margin:0 auto}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.steps i{width:28px;height:6px;border-radius:9px;background:rgba(20,40,80,.1)} .steps i.on{background:var(--sky)} .steps i.done{background:var(--leaf)}
.page h1{font-size:clamp(26px,4.4vw,38px);text-align:center;letter-spacing:-.01em}
.page .sub{text-align:center;color:var(--ink2);margin:6px 0 18px;font-size:16px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;justify-content:center;gap:10px;align-items:center;
  padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(180deg,rgba(255,248,236,0),rgba(255,248,236,.95) 40%)}
.foot .note{font-size:13px;color:var(--ink2);font-weight:600;max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;border-radius:24px;background:#fff;box-shadow:0 4px 18px rgba(30,60,120,.1);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%}
.card:hover{transform:translateY(-2px)} .card:active{transform:scale(.98)}
.card.sel{box-shadow:0 0 0 4px var(--sky),0 10px 30px rgba(47,155,255,.25)}
.card.lock{cursor:default;filter:saturate(.3);opacity:.75}
.card canvas{display:block;width:100%;height:auto}
.card .cb{padding:12px 14px 14px}
.card .cb b{font-family:var(--round);font-weight:600;font-size:19px;display:block}
.card .cb small{color:var(--ink2);font-size:13px;display:block;margin-top:2px;line-height:1.35}
.card .tag{position:absolute;top:10px;left:10px}
.card .lk{position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:999px;font-family:var(--round);font-size:16px;font-weight:600;color:var(--ink);background:#fff;box-shadow:0 2px 8px rgba(30,60,120,.15)}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink2);margin-top:6px}
.stat .bar{flex:1;height:6px;border-radius:9px;background:rgba(20,40,80,.08);overflow:hidden}.stat .bar i{display:block;height:100%;border-radius:9px;background:var(--sky)}
.cont{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 14px}
.cont button{height:40px;padding:0 16px;border-radius:999px;background:#fff;font-weight:700;box-shadow:0 2px 8px rgba(30,60,120,.08)}
.cont button.on{background:var(--ink);color:#fff}

/* profile */
.maker{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:20px;align-items:start}
@media (max-width:700px){.maker{grid-template-columns:1fr}}
#pv{width:100%;aspect-ratio:1/1.05;border-radius:28px;background:linear-gradient(#bfe6ff,#fff3dc);box-shadow:0 4px 18px rgba(30,60,120,.1)}
.opt{margin-bottom:14px}
.opt label{display:block;font-weight:700;font-size:13px;color:var(--ink2);margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.04em}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.sw button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--sky)}
.sw.txt button{width:auto;height:40px;padding:0 14px;border-radius:999px;background:#fff;font-weight:700;box-shadow:0 2px 8px rgba(30,60,120,.08)}
.sw.txt button.on{background:var(--ink);color:#fff;box-shadow:none}
.name{width:100%;box-sizing:border-box;height:52px;border-radius:16px;border:0;background:#fff;padding:0 18px;font-size:20px;font-family:var(--round);font-weight:600;box-shadow:0 2px 10px rgba(30,60,120,.08)}
/* family */
.fam .card .cb{text-align:center} .fam canvas{background:linear-gradient(#e6f4ff,#fff7e9)}
/* gear */
.trunk{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 2px 12px rgba(30,60,120,.08);margin:0 auto 14px;max-width:720px}
.trunk .slots{flex:1;display:flex;gap:4px;flex-wrap:wrap}
.trunk .slots i{width:18px;height:18px;border-radius:6px;background:rgba(20,40,80,.08)} .trunk .slots i.f{background:var(--leaf)} .trunk .slots i.over{background:var(--coral)}
.tip{max-width:720px;margin:0 auto 14px;background:#fff6df;border-radius:18px;padding:10px 14px;font-weight:600;color:#6b4b00;font-size:14px;display:flex;gap:10px;align-items:center}
.gear{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.gear .card{padding:14px;text-align:center}
.gear .card .em{font-size:40px;line-height:1.1;display:block}
.gear .card b{font-family:var(--round);font-weight:600;font-size:16px;display:block;margin-top:4px}
.gear .card small{display:block;color:var(--ink2);font-size:12px;margin-top:2px;line-height:1.3;min-height:31px}
.gear .card .dots{margin-top:6px;display:flex;gap:3px;justify-content:center}.gear .card .dots i{width:10px;height:10px;border-radius:4px;background:var(--sky)}
.gear .card.req::after{content:"Must bring";position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;color:#c2185b;background:#ffe2ec;padding:3px 7px;border-radius:9px}
.gear .card.sel{background:#eef8ff}
.gear .card.sel::before{content:"✓";position:absolute;top:8px;left:10px;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:20;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
#hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:10px;border-radius:999px;padding:5px 16px 5px 5px;min-height:46px;box-sizing:border-box}
#me canvas{width:38px;height:38px;border-radius:50%;background:linear-gradient(#cfeaff,#fff1d6)}
#me b{font-family:var(--round);font-weight:600;font-size:16px;display:block;line-height:1.1}
#me small{font-size:12px;color:var(--ink2);font-weight:700}
#coinsP{padding:6px 14px;font-family:var(--round);font-weight:600;font-size:17px;gap:6px}
#starsP{padding:6px 16px;font-family:var(--round);font-weight:600;font-size:17px;gap:6px}
.hb{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px}
#hudR{display:flex;gap:8px}
#place{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:19;pointer-events:none;font-family:var(--round);font-weight:600;font-size:16px;padding:7px 18px;border-radius:999px;white-space:nowrap}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;display:flex;justify-content:center;align-items:flex-end;gap:12px;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
#bar>*{pointer-events:auto}
.rb{width:62px;height:62px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1;transition:transform .12s}
.rb small{font-size:10px;font-weight:800;margin-top:3px;color:var(--ink2)}
.rb:active{transform:scale(.92)}
.rb.big{width:auto;height:62px;border-radius:999px;padding:0 24px;flex-direction:row;gap:8px;font-family:var(--round);font-weight:600;font-size:19px;background:var(--leaf);color:#fff;box-shadow:0 8px 22px rgba(34,194,122,.35)}
.glow{animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,183,43,.45),var(--shadow)}}
/* drive pedals */
.pedal{width:86px;height:86px;border-radius:28px;font-size:30px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.pedal small{font-size:11px;font-weight:800;color:var(--ink2)}
.pedal.on{transform:scale(.93);background:#fff}
.pedal.sm{width:64px;height:64px;border-radius:22px;font-size:24px}.pedal.sm small{font-size:10px}
.pedal.gas{height:86px}
.pedal.arrow{width:96px;height:96px;font-size:40px;border-radius:32px}
#drv .dm{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);gap:10px}
@media (max-width:760px){#drv .dm{bottom:calc(env(safe-area-inset-bottom,0px) + 116px)}.pedal{width:72px;height:72px;font-size:26px}.pedal.gas{height:72px}.pedal.arrow{width:80px;height:80px;font-size:34px}#drv>div{gap:8px}}
@media (max-width:760px) and (orientation:portrait){#drv .dm{flex-direction:column;left:max(14px,env(safe-area-inset-left,0px));transform:none}}
@media (max-height:500px){#drv .dm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto;left:max(14px,env(safe-area-inset-left,0px));transform:none}}
#drv{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
#drv>div{display:flex;gap:12px;pointer-events:auto}

/* ---------- Bubbles, toast, sheets, dialog ---------- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%) translateY(-10px);z-index:60;opacity:0;transition:all .3s;pointer-events:none;
  padding:10px 20px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#scrim{position:fixed;inset:0;z-index:44;background:rgba(40,70,120,.18)}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:45;width:min(760px,100%);max-height:84vh;box-sizing:border-box;border-radius:30px 30px 0 0;display:flex;flex-direction:column;
  padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 10px);animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
#sheet .hd{display:flex;align-items:center;gap:10px;padding:10px 20px 8px}
#sheet .hd h2{flex:1;font-size:24px}
#sheet .bd{overflow-y:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch}
.x{width:38px;height:38px;border-radius:50%;background:rgba(20,40,80,.07);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.tabs button{flex:none;height:36px;padding:0 14px;border-radius:999px;background:rgba(20,40,80,.06);font-weight:700;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:#fff;margin-bottom:8px;box-shadow:0 1px 6px rgba(30,60,120,.06);width:100%;box-sizing:border-box;text-align:left}
button.row:active{transform:scale(.985)}
.row .em{font-size:30px;width:46px;height:46px;border-radius:14px;background:#f1f7ff;display:flex;align-items:center;justify-content:center;flex:none}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-size:16px;font-family:var(--round);font-weight:600}.row .tx small{display:block;color:var(--ink2);font-size:13px;line-height:1.35}
.row.off{opacity:.45}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.coll div{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;font-size:12px;font-weight:700;box-shadow:0 1px 6px rgba(30,60,120,.06)}
.coll div span{display:block;font-size:30px;margin-bottom:4px}
.coll div.no{opacity:.35;filter:grayscale(1)}
#talk{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:46;width:min(720px,calc(100% - 24px));border-radius:28px;padding:16px;box-sizing:border-box;animation:up2 .25s}
@keyframes up2{from{transform:translate(-50%,24px);opacity:0}}
#talk .top{display:flex;gap:14px;align-items:flex-start}
#talk canvas{width:74px;height:74px;border-radius:22px;background:linear-gradient(#cfeaff,#fff1d6);flex:none}
#talk .who{font-family:var(--round);font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#talk .say{font-size:17px;line-height:1.45;margin-top:4px;min-height:48px}
#talk .ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#talk .ch button{height:44px;padding:0 16px;border-radius:999px;background:#fff;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(30,60,120,.1)}
#talk .ch button.main{background:var(--sky);color:#fff}
.hearts{color:var(--berry);font-size:14px;letter-spacing:1px}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;width:min(460px,calc(100% - 28px));max-height:calc(100% - 40px);overflow-y:auto;border-radius:32px;padding:24px 22px 20px;box-sizing:border-box;text-align:center;animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.85);opacity:0}}
#card .big{font-size:64px;line-height:1.1}
#card h2{font-size:26px;margin:8px 0 6px}
#card p{color:var(--ink2);font-size:16px;line-height:1.45;margin:6px 0}
#card .acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
#card .acts .btn{width:100%;white-space:normal;height:auto;min-height:52px;padding:10px 18px;line-height:1.2}
#card .acts .btn small{display:block;font-family:var(--ui);font-size:12px;font-weight:600;opacity:.85}
#card canvas{width:100%;border-radius:20px;margin-top:4px}
#mini{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:21;border-radius:999px;padding:8px 18px;font-family:var(--round);font-weight:600;font-size:17px;text-align:center;max-width:90vw}
#miniX{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);z-index:22}
body.title #hud,body.title #bar{display:none}
/* title */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:20px}
#title>*{pointer-events:auto}
#title .logo{font-family:var(--round);font-weight:700;font-size:clamp(52px,11vw,104px);line-height:.95;letter-spacing:-.02em;color:#fff;
  text-shadow:0 4px 0 rgba(20,90,160,.25),0 12px 40px rgba(20,90,160,.3)}
#title .tag{font-family:var(--round);font-weight:500;font-size:clamp(17px,2.6vw,22px);color:#fff;margin:12px 0 26px;text-shadow:0 2px 12px rgba(20,90,160,.4)}
#title .acts{display:flex;flex-direction:column;gap:12px;align-items:center}
#title .btn{min-width:240px;height:58px;font-size:20px}
#title .cont small{font-family:var(--ui);font-size:13px;opacity:.9;font-weight:600}
#saved{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:60;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none}
#saved.on{opacity:1}
@media (max-width:560px){ .rb{width:54px;height:54px;font-size:21px} .rb.big{height:54px;font-size:17px;padding:0 18px} #me small{display:none} .pedal{width:74px;height:74px} .pedal.sm{width:54px;height:54px;font-size:20px} .pedal.gas{height:96px} #place{font-size:14px} }
</style>
</head>
<body class="title">
<canvas id="g3" hidden></canvas>
<canvas id="game"></canvas>

<div id="title">
  <div class="logo">Wander Wild</div>
  <div class="tag">Pack the car. Pick a place. Go camping!</div>
  <div class="acts">
    <button class="btn sun cont" id="tCont" hidden></button>
    <button class="btn" id="tNew">New adventure</button>

azing!",go:"stars",out:""},{t:"Later!",out:"Don't miss it! Go stargazing before bed."}]},aurora:{big:"🌌",title:"Look up! The northern lights!",text:"The sky is glowing green and purple, waving like a giant ribbon! It's the aurora!",start:e=>{e.aurora=1,Audio.sfx("wish")},good:1,night:1,opts:[{t:"📷 Take a photo!",out:"Click! Nobody at school will believe this!",photo:"Northern lights",star:"aurora"},{t:"🔭 Watch from the stargazing spot",go:"stars",out:""}]},rainbow:{big:"🌈",title:"A rainbow!",text:"The rain stopped and a huge rainbow stretches across the sky!",good:1,opts:[{t:"📷 Take a photo",out:"Red, orange, yellow, green, blue, indigo, violet. You count every colour!",photo:"Rainbow"}]},joey:{big:"🦘",title:"Shh... look over there!",text:"A mother wallaby hops past slowly. A tiny joey is peeking out of her pouch!",good:1,opts:[{t:"👀 Watch quietly",out:"The joey wiggles its ears and ducks back into the pouch. So cute!",animal:"wallabyjoey"}]},dolphins:{big:"🐬",title:"Dolphins!",text:"At sunset, dolphins are jumping and surfing the waves near the cliffs!",good:1,opts:[{t:"📷 Snap a photo",out:"Splash! One leaps right out of the water as you click!",photo:"Dolphins at sunset"},{t:"👋 Wave hello",out:"You wave and wave. You're sure one of them waved its flipper back!"}]},owl:{big:"🦉",title:"Hoo-hoo! An owl visits",text:"A fluffy owl lands on a branch right above the campfire and stares at you with huge eyes.",good:1,night:1,opts:[{t:"🤫 Hoot back softly",out:"Hoo-hoo! The owl tilts its head... and hoots back! You just talked to an owl!",animal:"owl"}]}},SPECIAL_WHEN={storm:[1,3],wind:[2,0],raccoon:[1,4],meteor:[1,3],cows:[2,0],aurora:[1,4]},events=(()=>{let e=0;function t(e){if(!e.evQ||"camp"!==G.mode||sheetOpen())return;const t=e.evQ;e.evQ=null,surprise(t)}function a(e,t){const a=e.events||[];let o=["rain","mozzies","wetwood","scrape","lost","flat"].filter(e=>!a.includes(e));return"storm"===t.special&&(o=o.filter(e=>"rain"!==e)),e.slot<3&&(o=o.filter(e=>"mozzies"!==e)),e
